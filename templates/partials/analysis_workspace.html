
<section class="analysis-workspace">

    <div class="workspace-header">
        <h2>Facial Expression Analysis</h2>
        <p>Upload an image to begin AI-powered facial expression analysis.</p>
    </div>

    <div class="upload-container">
        <form action="/analyze" method="POST" enctype="multipart/form-data">

            <label for="image">Select Face Image</label>

            <input
                type="file"
                id="image"
                name="image"
                accept="image/*"
                required
            >

            <button type="submit">
                Analyze Image
            </button>

        </form>
    </div>

    <div class="camera-section">
        <h3>Camera Analysis</h3>
        <p>Use your camera to capture an image for analysis.</p>

        <a href="/camera" class="camera-button">
            Open Camera
        </a>
    </div>

</section>
